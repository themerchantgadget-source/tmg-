    transform:scaleY(.45)
  }

  50%{
    transform:scaleY(.85)
  }
}

  from{
    opacity:0;
    transform:translateY(4px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.fade-up{
  animation:fadeUp .25s ease both
}

  0%,100%{
    opacity:1
  }

  50%{
    opacity:0
  }
}

.caret{
  animation:blink 1s infinite
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.35
  }

  30%{
    transform:translateY(-2px);
    opacity:.8
  }
}

.typing-dot{
